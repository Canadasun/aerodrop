apiVersion: v1
kind: Namespace
metadata:
  name: aerodrop
  labels:
    app.kubernetes.io/part-of: aerodrop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aerodrop-config
  namespace: aerodrop
data:
  BACKEND_URL: http://aerodrop-backend:8000
  DELIVERY_LATITUDE: "51.130"
  DELIVERY_LONGITUDE: "-114.089"
  HOME_LATITUDE: "51.115"
  HOME_LONGITUDE: "-114.110"
  SIMULATE_LOW_BATTERY_AFTER_SECONDS: "180"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerodrop-backend
  namespace: aerodrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aerodrop-backend
  template:
    metadata:
      labels:
        app: aerodrop-backend
    spec:
      containers:
        - name: backend
          image: aerodrop-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aerodrop-backend
  namespace: aerodrop
spec:
  type: NodePort
  selector:
    app: aerodrop-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30800
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerodrop-xrce-agent
  namespace: aerodrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aerodrop-xrce-agent
  template:
    metadata:
      labels:
        app: aerodrop-xrce-agent
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: agent
          image: microros/micro-ros-agent:humble
          args: [udp4, -p, "8888"]
          ports:
            - name: xrce-udp
              containerPort: 8888
              protocol: UDP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
